name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
      HUGO_ENVIRONMENT: production
      TZ: Asia/Shanghai
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 大图分流：超过阈值的图片上传到 Azure Blob，正文引用改成 Blob 地址。
      # 没配 secret 时脚本会跳过（不是失败），仓库照样能构建。
      - name: Offload large images
        env:
          AZURE_STORAGE_CONNECTION: ${{ secrets.AZURE_STORAGE_CONNECTION }}
          AZURE_BLOB_CONTAINER: ${{ vars.AZURE_BLOB_CONTAINER || 'images' }}
          AZURE_BLOB_BASE: ${{ vars.AZURE_BLOB_BASE }}
          IMAGE_OFFLOAD_KB: ${{ vars.IMAGE_OFFLOAD_KB || '300' }}
        run: |
          if [ -z "$AZURE_STORAGE_CONNECTION" ] || [ -z "$AZURE_BLOB_BASE" ]; then
            echo "未配置 Azure 存储，跳过大图分流"
          else
            node scripts/offload-images.mjs --write
          fi

      - name: Build with Hugo
        run: |
          hugo \
            --minify \
            --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4