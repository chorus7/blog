{{ define "main" }}
	<div class="page-head">
		<h1 class="title">标签</h1>
		<div class="meta">共 {{ len .Site.Taxonomies.tags }} 个</div>
	</div>
	<div class="tag-cloud">
		{{- range .Site.Taxonomies.tags }}
		<a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a>
		{{- end }}
	</div>
{{ end }}
