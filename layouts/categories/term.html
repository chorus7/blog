{{ define "main" }}
	{{ range .Pages.GroupByDate "2006" }}
	<h2 class="archive-year-header">{{ .Key }} <sup class="archive-count">{{ len .Pages }}</sup></h2>
	<ul class="article-list">
		{{- range .Pages }}
		<li><span class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></span> <span class="post-date">{{ .Date.Format "01-02" }}</span></li>
		{{- end }}
	</ul>
	{{ end }}
{{ end }}
