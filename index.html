<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窝的随笔</title>
<link rel="stylesheet" href="wenkai.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到内容</a>

<div class="progress-track" aria-hidden="true"><div class="progress-fill" id="pfill"></div></div>

<div class="shell">

  <header class="masthead">
    <div class="masthead-line">
      <div>
        <a class="brand" href="#">窝的随笔<span class="brand-mark">随笔</span></a>
      </div>
      <div class="clock" id="clock">
        <strong>22:00</strong>
        2026年11月6日 · 周五
      </div>
    </div>
  </header>

  <nav class="nav" aria-label="主导航">
    <a href="#" aria-current="page">年谱</a>
    <a href="#">归档</a>
    <a href="#">关于</a>
    <a href="#">友链</a>
  </nav>

  <main id="main" class="chronicle">

    <section class="year">
      <div class="year-figure">
        2026
        <span class="year-count">1 篇</span>
      </div>
      <div class="year-body">
        <article class="entry" data-read-key="20261105-40f734">
          <h3><span class="read-dot" aria-hidden="true"></span><a href="post.html">中州第一篇：同步验证</a></h3>
          <p class="entry-foot">
            11月5日<span class="sep">／</span>日常<span class="sep">／</span>65 字<span class="entry-len" style="--len:4"></span>
          </p>
        </article>
      </div>
    </section>

    <section class="year">
      <div class="year-figure">
        2025
        <span class="year-count">3 篇</span>
      </div>
      <div class="year-body">
        <article class="entry" data-read-key="demo-a">
          <h3><span class="read-dot" aria-hidden="true"></span><a href="#">示例标题：这里会是你的第二篇</a></h3>
          <p class="entry-foot">
            示例日期<span class="sep">／</span><span class="sep">／</span>0 字<span class="entry-len" style="--len:2"></span>
          </p>
        </article>
        <article class="entry" data-read-key="demo-b">
          <h3><span class="read-dot" aria-hidden="true"></span><a href="#">示例标题：第三篇</a></h3>
          <p class="entry-foot">
            示例日期<span class="sep">／</span><span class="sep">／</span>0 字<span class="entry-len" style="--len:2"></span>
          </p>
        </article>
      </div>
    </section>

    <div class="chron-foot">
      <span>第 1 页 / 共 1 页</span>
      <a href="#">翻回第一页</a>
    </div>

  </main>

  <aside class="rail" aria-label="痕迹">
    <div class="rail-block">
      <span class="rail-key">读过</span>
      <span class="rail-val" id="readCount">0 / 3</span>
    </div>
    <div class="rail-block">
      <span class="rail-key">上次更新</span>
      <span class="rail-val" id="lastUpdate">—</span>
    </div>
    <div class="rail-block">
      <span class="rail-key">今年已过</span>
      <span class="rail-val" id="yearProgress">—</span>
    </div>
  </aside>

  <footer class="colophon">
    <span>2026 © 窝的随笔</span>
    <a href="#">抖音</a>
    <span>已运行 <span id="uptime">0</span> 天</span>
  </footer>

</div>

<script>
(function () {
  'use strict';
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  /* --- 页头实时钟 --- */
  var clockEl = document.getElementById('clock');
  function tickClock() {
    var d = new Date();
    clockEl.innerHTML = '<strong>' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</strong>' +
      d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + WEEK[d.getDay()];
  }

  /* --- 今年已过 --- */
  var yearEl = document.getElementById('yearProgress');
  function tickYear() {
    var d = new Date();
    var y = d.getFullYear();
    var start = new Date(y, 0, 1).getTime();
    var end = new Date(y + 1, 0, 1).getTime();
    var p = (d.getTime() - start) / (end - start) * 100;
    yearEl.textContent = p.toFixed(1) + '%';
  }

  /* --- 已运行天数 --- */
  var start = new Date(2026, 10, 5).getTime();
  var uptimeEl = document.getElementById('uptime');
  function tickUptime() {
    var n = Math.floor((Date.now() - start) / 86400000);
    uptimeEl.textContent = n < 0 ? 0 : n;
  }

  /* --- 阅读痕迹：localStorage --- */
  var KEY = 'allin.read';
  var read = {};
  try { read = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { read = {}; }

  var entries = [].slice.call(document.querySelectorAll('.entry[data-read-key]'));
  var countEl = document.getElementById('readCount');

  function paintRead() {
    var n = 0;
    entries.forEach(function (el) {
      var k = el.dataset.readKey;
      if (read[k]) { el.classList.add('is-read'); n++; }
    });
    countEl.textContent = n + ' / ' + entries.length;
  }

  entries.forEach(function (el) {
    var link = el.querySelector('h3 a');
    if (link) {
      link.addEventListener('click', function () {
        read[el.dataset.readKey] = Date.now();
        try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {}
        el.classList.add('is-read');
        paintRead();
      });
    }
  });
  paintRead();

  /* --- 阅读进度条 --- */
  var fill = document.getElementById('pfill');
  function tickProgress() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var p = h > 0 ? (window.scrollY / h) * 100 : 0;
    fill.style.height = p.toFixed(2) + '%';
  }

  /* --- 上次更新（当前取最新文章日期，接 Hugo 后会换成真值） --- */
  var lastEl = document.getElementById('lastUpdate');
  var newest = entries.length ? entries[0] : null;
  if (newest) {
    var t = newest.querySelector('time, .entry-foot');
    lastEl.textContent = '11·05';
  } else {
    lastEl.textContent = '—';
  }

  tickClock(); tickYear(); tickUptime(); tickProgress();

  setInterval(function () { tickClock(); tickYear(); }, 1000);
  setInterval(tickUptime, 60000);

  var raf = false;
  window.addEventListener('scroll', function () {
    if (raf) return;
    raf = true;
    requestAnimationFrame(function () { tickProgress(); raf = false; });
  }, { passive: true });
})();
</script>
</body>
</html>
