locale = "zh-CN"
# 站点配置 · 视觉照抄 juroku.net，内容为自己的
baseURL = "https://chorus7.github.io/blog/"
title = "Pill"

# 一天可发多篇，slug 精确到分钟
paginate = 10
paginatePath = "page"

[params]
  author = "Pill"
  description = "个人随记"

  # ===== 页脚 =====
  # 建站日期（运行时长从这里算起），格式 YYYY-MM-DD
  startDate = "2026-11-05"
  # 抖音主页，填完整链接；留空则页脚不显示抖音入口
  douyin = "https://www.douyin.com/user/MS4wLjABAAAAmTEMeML1Ez8WpGaeHEaCzGn0fpm6dRigVD1iM8j1Z1Y"

  # ===== 浏览器标签标题 =====
  # 首页标题
  titleHome = "二〇二六 | 个人博客"
  # 内页标题（文章、列表、分类等）
  titleInner = "个人博客 | 随记"
  # 原站 nav 四项，顺序不变
  [params.nav]
    home = "Home"
    archives = "Archives"
    about = "About"
    links = "Links"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许 <div class="note"> <div class="polaroid"> 这类自定义 HTML
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    # 文章目录只取二、三级标题，标题层级也正好对得上
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"